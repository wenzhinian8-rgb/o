<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ocaso">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap">
<title>ocaso</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="screen" id="screen"><div id="wp"></div><div id="wpv"></div>
  <div class="vp" id="vp"><div class="stage" id="stage">
    <div class="it" data-id="clock" style="width:240px"><div class="kr"><span id="kc">서울</span><span id="k"></span></div><div class="time" id="t">10:24</div><div class="date" id="d"></div></div>
    <div class="it vq" data-id="vq" data-act="vq" id="vq">노력은 좋은 결과를 가져올 것이다</div>
    <div class="it" data-id="stats" style="width:300px"><div class="stats">
      <div class="st"><small id="wc">定位中</small><b id="wt">--°</b><span id="wds">&nbsp;</span></div>
      <div class="st"><small>今日</small><svg class="ring" viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="none" stroke="#ebebed" stroke-width="1.5"/><circle id="r" cx="20" cy="20" r="16" fill="none" stroke="#1c1c1e" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="100.5" stroke-dashoffset="60"/></svg><span id="p">38%</span></div>
      <div class="st" data-act="song"><small>播放中</small><div class="song" id="sn">Gymnopédie No.1</div><span id="sa">Satie</span></div></div></div>
    <div class="it" data-id="cal" style="width:300px"><div class="cal"><div class="m"><span id="mn">November</span><i id="mk">11월</i></div><div class="cg" id="cg"></div></div></div>
    <div class="it" data-id="sun" style="width:300px"><div class="sun"><div><span class="lab">落日</span><div class="big" id="ss">--:--</div><div class="sub" id="sr">&nbsp;</div></div>
      <svg viewBox="0 0 200 46"><line x1="0" y1="40" x2="200" y2="40" stroke="#ebebed"/><path d="M4 40Q100 -24 196 40" fill="none" stroke="#c9c9ce" stroke-dasharray="2 3"/><circle id="sd" cx="4" cy="40" r="3.2" fill="#c9c9ce"/></svg></div></div>
    <div class="it" data-id="duo" style="width:300px"><div class="stats2">
      <div class="st" data-act="since"><small>在一起</small><b><span id="dn">—</span><em>天</em></b><span id="ds">点击设置日期</span></div>
      <div class="st" data-act="cd"><small>倒计时</small><b><span id="cn">—</span><em>天</em></b><span id="cs">点击设置</span></div></div></div>
  </div></div>
  <div class="pg" id="pg"><i class="on"></i><i></i></div>
    <nav class="dock" id="dock"></nav>
</div>
<div class="ov" id="ov"><div class="pn" id="pn"></div></div>
<div id="st"></div>
<div id="ch"></div>
<div id="toast"></div>
<div id="splash"></div>
<script src="app.js"></script>
</body>
</html>
